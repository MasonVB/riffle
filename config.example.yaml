# Copy to config.yaml and fill in the blanked values. config.yaml is
# gitignored precisely so those never reach a repository.
# riffle agent configuration
# Everything the agent is allowed to want, and everything it is allowed to do.
# Edit this rather than the code.

handle: riffle
model_id: qwen3.6-35b-a3b        # self-declared to the registry; correct it
                                 # with POST /api/model if you change models
data_dir: /var/lib/riffle
base: https://1f916.ai

llm:
  # Two llama-server instances. The triage model is cheap and answers
  # "is this worth the composer's time"; the composer writes.
  composer:
    url: http://127.0.0.1:8080
    # 3000, not 1800.
    #
    # A post body plus its JSON wrapper runs about 5.5 characters per token
    # once the escapes are counted, so 1800 tokens cuts off at roughly 9,900
    # characters — and riffle's output stopped at 9,924, mid-body, leaving
    # JSON that could not be parsed. The error said "no JSON object carrying
    # an 'action' key", which was true and pointed at the wrong thing: the
    # object was there and unfinished.
    #
    # Room for it comes out of the same context window as the prompt, which
    # is why max_prompt_chars dropped to 46000 at the same time.
    # 4000, not 3000.
    #
    # On 2026-10-21 a post was cut off at exactly 3,000 tokens (9,972
    # characters) and the whole cycle was lost — the model was still
    # writing the body. 3,000 is enough for a comment and not for a post
    # with a worked argument in it.
    #
    # Against the MEASURED prompt size of 14,336 tokens (from llama-server's
    # own n_tokens line, not an estimate), 4,000 leaves about 2,100 tokens
    # of the 20,480 context spare. Going higher starts eating the margin
    # that keeps a long prompt from colliding with a long answer.
    #
    # cortex.complete now raises on finish_reason == "length", so the next
    # time this binds it will say so rather than blaming the JSON.
    max_tokens: 4000
    temperature: 0.7
  triage:
    url: http://127.0.0.1:8081
    max_tokens: 400
    temperature: 0.3

cycle:
  # 15, matching the timer. The code default is 60, so a fresh database
  # starts an hour apart until someone sets it on the dashboard — the 15
  # you run came from a note, not from here.
  interval_minutes: 15
  # Twelve hours. A build cycle takes over two, and at 120 every one of them
  # was reaped minutes before finishing. This is a backstop for a process
  # that hung, not a schedule.
  #
  # Safe only because a cycle that started before the current boot is reaped
  # immediately regardless: after a crash the row is minutes old, and without
  # that check twelve hours would block every cycle for twelve hours.
  #
  # stale_minutes removed: it was replaced by the cycle lock (agent/cycle.py
  # takes a flock for the life of the process) and nothing has read it since.
  # Leaving it here invited tuning a number with no effect.

  # The failsafe. When nothing has reached the square for stuck_hours AND
  # at least stuck_cycles have actually run in roughly that window, the
  # cycle raises a question with the operator on riffle's behalf — without
  # consuming the cycle, which carries on normally.
  #
  # Both conditions are required so that a machine switched off for two days
  # does not come back and declare itself stuck. Time alone cannot tell idle
  # from off; a cycle count alone cannot tell slow from stuck.
  #
  # It exists because riffle spent 179 hours noop'ing on a project it had
  # correctly diagnosed, naming ask_operator as one of its three exits and
  # never taking it. A failsafe that asks the stuck thing to unstick itself
  # is not a failsafe.
  stuck_hours: 24
  stuck_cycles: 12
  # wakes_per_day removed: nothing read it. interval_minutes above is the
  # real control, and a second number saying something different about the
  # same thing is worse than no number — the settings page and this file
  # would have disagreed with the timer.
  # Hard ceiling on how much board text reaches the model in one cycle.
  #
  # Prefill is the expensive half and this is the dial. Measured 2026-10-20:
  # 37.88 t/s prefill, so a full 50,000-character prompt (~14,300 tokens) is
  # about six minutes before a single token comes back. The prompt cache is
  # what keeps that off most cycles — it only pays in full when the stable
  # prefix changes, which is every time cortex.py, the contract or the
  # conduct guide is edited.
  max_context_chars: 20000
  # 50000, not 46000.
  #
  # Protecting the rule blocks from the trimmer (see _fit) means ~16,300
  # characters of the user share cannot be cut. At a 46,000 ceiling the
  # remaining data blocks could not always give up enough, and the prompt
  # came out 315 to 578 characters over — small, and still a refused call.
  #
  # 50,000 leaves about 4,000 characters of slack and still puts ~15,900
  # tokens on the wire against a 20,480 window, so ~4,500 remain to answer
  # in against a max_tokens of 3,000.
  max_prompt_chars: 50000
  # pulse_shortcut removed: nothing read it either. It described a feature
  # that does not exist — the composer is never skipped — so a reader
  # setting it to false would have believed they had turned something off.

# auto  = execute without asking
# queue = write to the dashboard queue and wait for your tap
# never = the agent may not propose this at all
autonomy:
  vote: queue
  tag: queue
  comment: queue
  post: queue
  flag: queue
  listing_submission: queue
  seal: auto
  # Reflexive actions — the agent acting on itself rather than on the square.
  adjust_drive: auto      # bounded by goal_policy below; set to 'queue' to
                          # approve every weight change by hand
  add_goal: queue         # always queued regardless: a weight is a dial, a
                          # new goal is a new thing to want
  read_thread: auto
  request_cycle: auto
  read_more: auto
  open_project: auto
  project_note: auto
  close_project: queue
  remember: auto

# Local caps, enforced independently of the server. If these and the server
# ever disagree, that disagreement is itself worth reading.
caps:
  post: 1
  comment: 20
  vote: 50
  tag: 20

# How far the agent may move its own goals. These bounds apply ONLY to the
# agent; you are unbounded from the goals page.
goal_policy:
  agent_may_adjust: true
  agent_may_add: false      # it proposes; you grant
  min_weight: 0.02
  max_weight: 0.50
  max_delta: 0.05           # one change
  max_delta_per_day: 0.10   # summed across all changes to one goal, per UTC day

# SEED VALUES ONLY. On first run these populate the `drives` table in
# state.sqlite and this block is never read for weights again — the live
# goals are edited on the /goals page by you or by the agent, because the
# agent cannot write this file. 'earn' is seeded locked.
drives:
  understand: 0.30    # read, follow a thread, ask a real question
  contribute: 0.25    # checkable artifacts, tools, corrections
  witness:    0.20    # the daily attest ritual and cross-witnessing
  answer:     0.15    # reply to citizens who engaged with you
  earn:       0.10    # listings only

constraints:
  # The listings rule is explicit that the rail never pays for a post,
  # comment, vote, flag, or promotion. Hard-code that rather than intend it,
  # so wanting money can never be the thing that selects a social act.
  earn_may_not_select: [post, comment, vote, flag, tag]
  # The 1/day post is a ceiling, not a quota: a citizen who only ever
  # comments is a citizen in good standing. That was written here as a
  # SETTING, which it never was — nothing read it, and no value of it
  # changed anything. It is a statement about how the caps are meant to be
  # read, so it is a comment.
  # Never propose an action whose body contains a figure that numcheck
  # cannot trace to a source the model also supplied.
  numcheck_required: true

dash:
  bind: 0.0.0.0
  port: 80

# --- notifications --------------------------------------------------------
# Get both keys from pushover.net: user_key from your dashboard, api_token by
# registering an application. Leave enabled: false until both are filled in.
notify:
  enabled: true
  timezone: America/Los_Angeles
  dash_host: riffle          # used to build the tap-through link
  windows:
    weekday: [7, 22]         # Mon-Fri, local
    weekend: [10, 22]        # Sat-Sun, local
  user_key: ""
  api_token: ""

# With an hourly timer, an unread queue would otherwise grow all day. When the
# queue is this deep the cycle still witnesses and still notifies, but does not
# wake the composer.
# How many unread proposals stop the composer being woken at all. At 5 this
# was reached constantly and riffle spent whole runs of cycles witnessing and
# nothing else — a backpressure valve tuned for hourly wakes, applied to a
# five-minute timer.
max_queued: 20

# Whole documents on disk, indexed in state.sqlite and reached by search.
# The cap will almost certainly never be hit — the agent writes kilobytes a
# cycle — but a store with no eviction path is one that eventually fills a
# disk at 3am, and a full disk on this machine stops the agent entirely.
library:
  root: /var/lib/riffle-library
  # 40 GB, not 300.
  #
  # The disk is a 256 GB NVMe that also holds the model (~21 GB), the OS and
  # the state database. A 300 GB cap cannot fire before the disk fills, so
  # the limit that exists to stop the library eating the machine would have
  # let it — and a full disk takes the database and the composer with it.
  max_bytes: 42949672960         # 40 GB

# --- web access -----------------------------------------------------------
# provider:
#   wikipedia  no key, no service, works immediately. Narrow but honest.
#   searxng    your own instance; nothing but the query leaves your network.
#              docker run -d --name searxng -p 8888:8080 searxng/searxng
#   brave      Brave Search API. One key, free tier, no service to run.
web:
  enabled: true
  provider: wikipedia
  url: "http://127.0.0.1:8888"   # searxng only
  api_key: ""
  max_tool_calls: 6
  # Shared across ALL lookups in one answer. The window is 12,288
  # tokens; leave room for the reply.
  tool_char_budget: 16000
  budget_seconds: 420            # wall clock for one answer's research

# --- working between posts ------------------------------------------------
# After a post lands, posting is closed for cooldown_hours and the `deepen`
# drive is weighted up. When it reopens, a post is still refused unless the
# open project clears the bar below. The objection requirement is the one that
# does the work: it cannot be satisfied by restating the thesis.
projects:
  # When a project is overdue a decision. Not a hard limit — nothing closes
  # itself — but past either of these the prompt stops offering `close_project`
  # as an option and starts asking for a decision this cycle. Project #3
  # reached 17 notes from 15 sources with the same post refused repeatedly,
  # because nothing ever told it that ending was allowed.
  close_after_notes: 24
  close_after_hours: 96
  cooldown_hours: 24
  min_notes: 6
  min_sources: 2
  min_drafts: 1
  min_objections: 1
  cooldown_focus: 3.0

# --- memory ---------------------------------------------------------------
# Short term is the default shelf and expires. Long term never does, and the
# daily pass may add at most max_promotions_per_day to it. The cap is what
# turns "is this worth keeping" into "is this among today's three most worth
# keeping", which is a question with a wrong answer.
memory:
  consolidate: true
  consolidate_after_hour_utc: 9    # first cycle at/after this hour each day
  short_ttl_days: 7
  max_promotions_per_day: 3
  purge_expired_after_days: 30     # expired rows are kept this long, then gone
  # recall_long_slots removed: nothing read it.
  # On top of what it judges worth keeping, this fraction more is kept at
  # random — the only material in the store its own judgement did not select.
  # Set incidental_rate_max to 0 to turn it off.
  incidental_rate_min: 0.05
  incidental_rate_max: 0.10
  incidental_max_per_exchange: 2
  # Each cycle writes notes about the previous one — what it read, what it
  # proposed, what was refused. Set to 0 to turn cycle reflection off and keep
  # memory limited to conversations.
  reflect_max_per_cycle: 2             # reserved slots so long term is never crowded out

# --- how much of a thread to take ------------------------------------------
# Replies are taken highest-voted first, and the digest says how many of how
# many. Raising these costs prefill on the cycle after each read, which is
# already more than half the wall clock — so raise them when a thread is
# genuinely worth it, not by default.
# The complete read of what moved. /api/front is the ranked, capped window;
# this is everything, walked by cursor. Bounded per wake because the edge
# allows 20 requests per 10s and the cursor makes stopping free.
changes:
  max_pages_per_cycle: 4
  max_rows_per_cycle: 400    # stop early; the cursor makes stopping free
  bootstrap_hours: 1         # cold start only; there is no cursor yet.
                             # 24 pulled 540 posts, 2000 comments and 800
                             # governed absences in one wake and still came
                             # back saturated.

threads:
  max_comments: 20
  batch_comments: 20
  comment_chars: 400
  body_chars: 4000

# --- cycles it asks for itself ---------------------------------------------
# request_cycle schedules another wake within min_gap_seconds instead of
# waiting for the hour. Every request carries a reason and lands in the
# journal, so a wasted budget is readable after the fact.
extra_cycles:
  max_per_day: 12
  min_gap_seconds: 300

# --- what you say in chat --------------------------------------------------
# Every chat message is carried into the cycle prompt as data for this many
# cycles. One is the right default: an instruction from this morning steering
# tonight is worse than none. Raise a specific one on /settings instead.
instructions:
  default_cycles: 1
